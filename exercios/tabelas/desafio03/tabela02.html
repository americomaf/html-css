<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela02</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
            font-size: 1.5em;
            font-weight: bold;
        }
        table{
            border-collapse: collapse;
            width: 450px;
        }
        tr, td, th{
            border: 1px solid black;
            padding: 5px;
        }
        .cnome{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>32</td>
            <td>Médica</td>
        </tr>
         <tr>
            <td>Fernanda José</td>
            <td>F</td>
            <td>25</td>
            <td>Professora</td>
        </tr>
         <tr>
            <td>Mario Zacarias</td>
            <td>M</td>
            <td>41</td>
            <td>Carpinteiro</td>
        </tr>
         <tr>
            <td>Pedro Lucas</td>
            <td>M</td>
            <td>33</td>
            <td>Técnico Informático</td>
        </tr>
         <tr>
            <td>Laura Carlos Timbe</td>
            <td>F</td>
            <td>22</td>
            <td>Loucutora</td>
        </tr>
    </table>
</body>
</html>
