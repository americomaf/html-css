<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        table{
            margin: auto;
            width: 400px;
            border-collapse: collapse;
        }
        td{
            border: 1px solid black;
            text-align: center;
            padding: 8px;
        }
        tr.linha{
            background-color: lightcoral;
        }
        td.dados{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>Minha tabela</h1>
    <Table>
       <tr class="linha">
        <td>A1</td>
        <td class="dados">B1</td>
        <td>C1</td>
       </tr>
       <tr>
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
       </tr>
       <tr class="linha">
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
       </tr>
       <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
       </tr>
    </Table>
</body>
</html>
