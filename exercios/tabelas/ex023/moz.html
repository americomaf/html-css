
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolução da População</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        td,th{
            border: 1px solid black;
            padding: 10px;
        }
        th{
            background-color: black;
            color: white;
        }
        caption{
            padding: 10px;
            background-color: gray;
        }
    </style>
</head>
<body>
    <h1>Evolução da População em Moçambique</h1>

    <table>
        <caption>Distribuição da População em Moçambique</caption>
        <thead>
            <th>Ano do Censo</th>
            <th>População</th>
            <th>Variação </th>
            <th>%</th>
        </thead>
        
        <tbody>
            <tr>
                <td>1980</td>
                <td>12.130.000</td>
                <td>-</td>
                <td>-</td>
            </tr>
            <tr>
                <td>1997</td>
                <td>16.099.246</td>
                <td>3.969.246</td>
                <td>32,7</td>
            </tr>
            <tr>
                <td>2007</td>
                <td>20.579.265</td>
                <td>4.480.019</td>
                <td>27,8</td>
            </tr>
            <tr>
                <td>2017</td>
                <td>28.861.863</td>
                <td>8.282.598</td>
                <td>28,7</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
